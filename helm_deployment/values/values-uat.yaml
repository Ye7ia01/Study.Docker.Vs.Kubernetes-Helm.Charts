# UAT environment overrides.
# Only keys that differ from the base values.yaml need to be listed here.

global:
  backendPort: 8090 # shared by backend's Service and frontend's BACKEND_URL

backend:
  replicaCount: 2

frontend:
  replicaCount: 2
  service:
    port: 8091      # Service port (internal, cluster-facing)
    nodePort: 30090  # external port reachable via minikube
