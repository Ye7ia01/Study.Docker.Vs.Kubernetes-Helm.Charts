apiVersion: v1
kind: Secret
metadata:
  name: database-secret
type: Opaque
# stringData accepts plain text (not pre-encoded base64) — Kubernetes encodes it automatically.
# Never commit a real password here: override this placeholder via --set or an untracked values file.
stringData:
  POSTGRES_PASSWORD: {{ .Values.global.postgresql.auth.password | default "CHANGE_ME_AT_INSTALL_TIME" | quote }}
