apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}
spec:
  selector:
{{- include "backend.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.global.backendPort }} # Service port
      targetPort: {{ .Values.appPort }} # App Container port
  type: {{ .Values.service.type }}
  